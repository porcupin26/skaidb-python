name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.8 builds are only published for the 22.04 runner image.
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests (no server needed)
        run: python -m pytest -q tests
      - name: Import check
        run: python -c "import skaidb; print(skaidb.__version__)"

  package:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Installed package reports the packaged version
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import skaidb, sys; print(skaidb.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
